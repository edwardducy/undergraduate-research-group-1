project:
  type: default
  render:
    - chapters/chapter-2/draft.qmd

lang: en-US
bibliography: references.bib
csl: apa-7th-edition.csl
citeproc: true
link-citations: true
reference-section-title: References

format:
  pdf:
    pdf-engine: xelatex
    papersize: letter
    fontsize: 12pt
    linestretch: 2
    geometry:
      - left=1.5in
      - right=1in
      - top=1in
      - bottom=1in
    header-includes:
      - |
        \setmainfont{texgyretermes-regular.otf}[
          Path = ../../fonts/,
          BoldFont = texgyretermes-bold.otf,
          ItalicFont = texgyretermes-italic.otf,
          BoldItalicFont = texgyretermes-bolditalic.otf
        ]
      - |
        \usepackage{etoolbox}
        \AtBeginEnvironment{longtable}{\fontsize{8pt}{9.6pt}\selectfont}
