project:
  type: default
  render:
    - chapters/chapter-1/revised-draft.qmd
    - chapters/chapter-2/revised-draft.qmd
    - chapters/chapter-3/draft.qmd

lang: en-US
bibliography: references.bib
author:
  - name: Prinz Edward L. Ducyogen
    affiliations: Centro Escolar University
    email: ducyogenpred@gmail.com
    corresponding: true

format:
  apaquarto-pdf:
    documentmode: stu
    fontsize: 12pt
    linestretch: 2
    mainfont: "Times New Roman"
    geometry:
      - left=1.5in
      - right=1in
      - top=1in
      - bottom=1in
    include-in-header:
      text: |
        \usepackage{etoolbox}
        \AtBeginEnvironment{longtable}{\setstretch{1}}
        \AtBeginEnvironment{longtable}{\setlength{\extrarowheight}{2pt}}
        \makeatletter
        \def\endlongtable{\endoldlt}
        \makeatother

