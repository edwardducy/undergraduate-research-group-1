# Vale configuration for thesis prose linting.
# The APA7 style encodes the automatable subset of thesis/docs/apa7-mechanics.md;
# every alert message cites the APA section it enforces so findings trace
# back to the manual. Judgment-based rules (citations, ethics, bias-free
# language) remain manual — see styles/APA7/README.md for the split.
#
# Run: mise run lint                    (lints the three chapter drafts)
#      vale thesis/chapters/02-review.qmd  (single file)
#      vale --minAlertLevel=suggestion --no-exit thesis/chapters/01-introduction.qmd
#           (also show suggestion-level findings, never fail the exit code)
# Levels: error > warning > suggestion; exit code fails on warning and above.

MinAlertLevel = warning
StylesPath = styles
Vocab = Thesis

[formats]
qmd = md

[*.{qmd,md}]
BasedOnStyles = Vale, APA7, CEU
