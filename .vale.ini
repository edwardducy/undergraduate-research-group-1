# Vale configuration for this repository.
# Documentation: https://docs.vale.sh
#
# The StylesPath folder (.vale/styles) is created and filled by:
#   vale sync
# Packages are downloaded from the Vale package explorer (https://vale.sh/explorer).

StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Base

Packages = Google, write-good, alex, Readability

[*.md]
BasedOnStyles = Vale, Google, write-good, alex, Readability

alex.Condescending = NO
alex.ProfanityUnlikely = NO
Google.Parens = NO
Google.Passive = NO
Google.We = NO
Google.WordList = error
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.FleschKincaid = YES
Readability.FleschReadingEase = NO
Readability.GunningFog = YES
Readability.LIX = NO
Readability.SMOG = NO
Vale.Terms = NO
write-good.E-Prime = NO
write-good.Passive = error
write-good.So = NO
write-good.TooWordy = warning
write-good.Weasel = error
