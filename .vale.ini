StylesPath = .vale/styles
Vocab = Base

Packages = write-good, proselint, neighbor, Google

# This configuration defines separate linting profiles for documentation and research files.
#
# Documentation files (docs/ and AGENTS.md) target readers whose first language is not English.
# These files require plain language, direct sentences, and active voice.
# The Google style provides rules for documentation clarity.
#
# Research files (research/) contain formal academic writing.
# These files permit academic vocabulary, passive voice, and hedged statements.
#
# Vale combines rule settings across all matching blocks.
# Because overlapping blocks cause rule conflicts, the block patterns remain separate.
#
# The configuration disables write-good.Passive in both profiles for different reasons.
# In the documentation profile, Google.Passive enforces active voice, so disabling write-good.Passive prevents duplicate warnings.
# In the research profile, researchers may use passive voice for academic prose.

[docs/**/*.md]
BasedOnStyles = Vale, write-good, proselint, neighbor, Google, repository-rules
write-good.Passive = NO
Google.Headings = NO
Google.Contractions = NO

[AGENTS.md]
BasedOnStyles = Vale, write-good, proselint, neighbor, Google, repository-rules
write-good.Passive = NO
Google.Headings = NO
Google.Contractions = NO

[research/**/*.md]
BasedOnStyles = Vale, write-good, proselint, neighbor
write-good.Cliches = NO
neighbor.GenderedLanguage = NO
write-good.Passive = NO
write-good.Weasel = NO
write-good.E-Prime = NO

[research/literature/**/*.md]
BasedOnStyles =

[research/archive/**/*.md]
BasedOnStyles =
