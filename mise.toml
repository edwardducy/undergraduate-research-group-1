[tools]
python = "3.12"
uv = "latest"
typst = "latest"
pandoc = "latest"
"aqua:quarto-dev/quarto-cli" = "latest"
node = "26"
pnpm = "latest"

[tasks.sync]
description = "Synchronize Quarto manuscript to Google Docs"
run = "uv run python scripts/gdocs_manager.py sync"

[tasks.diff]
description = "Compare local manuscript with Google Doc"
run = "uv run python scripts/gdocs_manager.py diff"

[tasks.status]
description = "Check Google Doc status and comment counts"
run = "uv run python scripts/gdocs_manager.py status"

[tasks.comments]
description = "Display reviewer comments and feedback from Google Doc"
run = "uv run python scripts/gdocs_manager.py comments"

[tasks.build-figures]
description = "Compile Typst figures to PDF"
run = "uv run python scripts/build_figures.py"

[tasks.defense-dev]
description = "Start Slidev development server for defense-v1"
run = "pnpm --prefix defense-v1 dev"

[tasks.defense-remote]
description = "Start Slidev development server with mobile remote control for defense-v1"
run = "pnpm --prefix defense-v1 dev:remote"

[tasks.defense-tunnel]
description = "Start Slidev development server with Cloudflare tunnel for defense-v1"
run = "pnpm --prefix defense-v1 dev:tunnel"

[tasks.defense-build]
description = "Build static presentation for defense-v1"
run = "pnpm --prefix defense-v1 build"

[tasks.defense-export]
description = "Export defense-v1 presentation to PDF"
run = "pnpm --prefix defense-v1 export"
