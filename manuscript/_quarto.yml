project:
  type: book
  output-dir: _book

book:
  title: "Benchmarking Dynamic Multitask Balancing in a Multilingual Encoder for Joint Triage of Taglish Disaster Tweets"
  author: "Prinz Edward Ducyogen"
  date: today
  output-file: thesis
  chapters:
    - index.qmd
    - 01-introduction.qmd
    - 02-literature.qmd
    - 03-methodology.qmd
    - 04-results.qmd
    - 05-conclusion.qmd
    - references.qmd
  appendices:
    - appendix-a.qmd

bibliography: bibliography.bib
csl: apa.csl
link-citations: true
toc: false
number-sections: true

format:
  pdf:
    filters:
      - caption-notes.lua
    include-in-header: latex-styles.tex
    documentclass: scrreprt
    papersize: letter
    mainfont: "Times New Roman"
    fontsize: 12pt
    geometry:
      - left=1.5in
      - right=1in
      - top=1in
      - bottom=1in
    linestretch: 2.0
    colorlinks: true
  html:
    theme: flatly
