project:
  type: book
  output-dir: _book

book:
  title: "Benchmarking Dynamic Multitask Balancing in a Multilingual Encoder for Joint Triage of Taglish Disaster Tweets"
  author: "Prinz Edward Ducyogen"
  date: today
  output-file: thesis
  chapters:
    - index.qmd
    - 01-introduction.qmd
    - 02-literature.qmd
    - 03-methodology.qmd
    - 04-results.qmd
    - 05-conclusion.qmd
    - references.qmd
  appendices:
    - appendix-a.qmd

bibliography: bibliography.bib
csl: apa.csl
link-citations: true

format:
  pdf:
    documentclass: scrreprt
    papersize: letter
    geometry:
      - left=1.5in
      - right=1in
      - top=1in
      - bottom=1in
    number-sections: true
    toc: false
    linestretch: 1.667
    colorlinks: true
  html:
    theme: flatly
    toc: false
    number-sections: true
