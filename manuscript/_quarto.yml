project:
  type: book

book:
  title: "Benchmarking Dynamic Multitask Balancing in a Multilingual Encoder for Joint Triage of Taglish Disaster Tweets"
  author: "Prinz Edward Ducyogen"
  date: today
  output-file: thesis

# Chapter lists live in the profiles: the full list in _quarto-full.yml and the
# Chapter 1 cut in _quarto-ch1.yml. Render the whole thesis with `mise run pdf`
# and the Chapter 1 cut with `mise run ch1`.
profile:
  group:
    - [full, ch1]

# Shared options
bibliography: bibliography.bib
csl: apa.csl
link-citations: true
number-sections: true
toc: false

format:
  pdf:
    # Page and typography
    documentclass: scrreprt
    papersize: letter
    fontsize: 12pt
    mainfont: "Times New Roman"
    geometry:
      - left=1.5in
      - right=1in
      - top=1in
      - bottom=1in
    linestretch: 2.0
    # Thesis styling
    include-in-header: latex-styles.tex
    filters:
      - caption-notes.lua
  html:
    theme: flatly
