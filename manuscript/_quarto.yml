project:
  type: book
  output-dir: _book

book:
  title: "Benchmarking Dynamic Multitask Balancing in a Multilingual Encoder for Joint Triage of Taglish Disaster Tweets"
  author: "Prinz Edward Ducyogen"
  date: today
  output-file: thesis
  chapters:
    - index.qmd
    - 01-introduction.qmd
    - 02-literature.qmd
    - 03-methodology.qmd
    - 04-results.qmd
    - 05-conclusion.qmd
    - references.qmd
  appendices:
    - appendix-a.qmd

bibliography: bibliography.bib
csl: apa.csl
link-citations: true

format:
  pdf:
    filters:
      - apa-notes.lua
    documentclass: scrreprt
    papersize: letter
    mainfont: "Times New Roman"
    fontsize: 12pt
    geometry:
      - left=1.5in
      - right=1in
      - top=1in
      - bottom=1in
    number-sections: true
    toc: false
    linestretch: 2.0
    colorlinks: true
    header-includes:
      - \usepackage{caption}
      - \captionsetup{format=plain, labelsep=newline, labelfont=bf, textfont=it, justification=raggedright, singlelinecheck=false, skip=6pt}
      - \usepackage{scrlayer-scrpage}
      - \clearpairofpagestyles
      - \ohead{\pagemark}
      - \setkomafont{disposition}{\normalfont\bfseries}
      - \setlength{\parindent}{0.5in}
      - \usepackage{indentfirst}
      - \usepackage{floatrow}
      - \floatsetup[figure]{capposition=top}
      - \usepackage{float}
      - \makeatletter
      - \def\fps@figure{H}
      - \makeatother
      - \usepackage{etoolbox}
      - \AtBeginEnvironment{longtable}{\singlespacing\footnotesize}
      - \AtBeginEnvironment{tabular}{\singlespacing\footnotesize}
      - \setlength{\LTleft}{0pt}
      - \setlength{\LTright}{\fill}
      - \setlength{\LTcapwidth}{\textwidth}
      - \setlength{\LTpost}{0pt}
  html:
    theme: flatly
    toc: false
    number-sections: true
