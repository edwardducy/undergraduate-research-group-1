project:
  type: book

book:
  title: "Benchmarking Dynamic Multitask Balancing in a Multilingual Encoder for Joint Triage of Taglish Disaster Tweets"
  author:
    - Isaiah Raphael Almuena
    - Prinz Edward L. Ducyogen
    - Carlo Miguel Geronimo
    - Kyle Uri Gabriel Lu
    - Yngwie Sebastian Patricio
  output-file: thesis

# Chapter lists live in the profiles: _quarto-full.yml and _quarto-ch1.yml.
profile:
  group:
    - [full, ch1]

# Shared options
bibliography: bibliography.bib
csl: apa.csl
link-citations: true
number-sections: true
toc: false

format:
  pdf:
    # Page and typography
    documentclass: scrreprt
    papersize: letter
    fontsize: 12pt
    mainfont: "Times New Roman"
    geometry:
      - left=1.5in
      - right=1in
      - top=1in
      - bottom=1in
    linestretch: 2.0
    # Thesis styling
    include-in-header: latex-styles.tex
    template-partials:
      - title.tex
    filters:
      - caption-notes.lua
  html:
    theme: flatly
